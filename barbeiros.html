<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda do barbeiro</title>
  <link rel="stylesheet" href="style.css">

<meta name="theme-color" content="#111111">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<link rel="apple-touch-icon" href="/img/pwa-192.png">

<script src="pwa.js"></script>

</head>
<body data-page="barbeiro">
  <main class="container">
    <p class="kicker" id="nomeSalaoAgenda">ÁREA DO PROFISSIONAL</p>
    <h1 id="tituloAgenda">Minha agenda</h1>
    <p id="mensagemAgenda" class="subtitulo" role="status">Carregando sua agenda...</p>

<section id="painelAssinatura" class="painel-assinatura" hidden>
  <h3>Minha assinatura</h3>

  <p id="tipoPlano"></p>
  <p id="dataVencimento"></p>

  <p id="diasRestantes" class="dias-restantes"></p>

  <div id="avisoRenovacao" class="aviso-renovacao" hidden>
    <strong>⚠️ Sua assinatura vence hoje!</strong>
    <p>
      Entre em contato com o suporte para
      renovar seu plano e evitar a interrupção
      dos agendamentos.
    </p>
  </div>
</section>

    <label for="dataFiltro">Selecione a data</label>
    <input type="date" id="dataFiltro">
    <div id="listaAgendamentos"></div>
    <button id="btnSair" type="button" class="btn-secundario">Sair da conta</button>

<a
  class="botao-suporte"
  href="https://wa.me/5542999806150?text=Ol%C3%A1%21%20Preciso%20de%20suporte%20com%20meu%20sistema%20de%20agendamentos."
  target="_blank"
  rel="noopener noreferrer"
>
  💬 Falar com o suporte
</a>

  </main>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="script.js"></script>
</body>
</html>
